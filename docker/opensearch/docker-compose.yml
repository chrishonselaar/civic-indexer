# Adapted from wob-search-mcp/docker-compose-opensearch.yml (2.11 -> 2.19, dashboards dropped).
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: civic-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - DISABLE_SECURITY_PLUGIN=true # local development only
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - cluster.name=civic-cluster
      - knn.plugin.enabled=true
      - knn.algo_param.index_thread_qty=2
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - civic-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  civic-opensearch-data:
    driver: local
